name: Windows and Ubuntu checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Record runner and Bun
        run: |
          printf '%s %s (%s %s)\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          bun --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Test frontend
        run: bun test
      - name: Typecheck frontend
        run: bun run check
      - name: Check formatting
        run: bun run lint

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bundle: nsis
            suffix: .exe
            package: windows-x64
          - os: ubuntu-24.04
            bundle: deb
            suffix: ''
            package: ubuntu-24.04-amd64
    env:
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake file libasound2-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config
      - name: Set up the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Record runner and build tools
        run: |
          printf '%s %s (%s %s)\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          rustc -vV
          cmake --version
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --locked --workspace --no-fail-fast
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for host parity
        run: bunx playwright install --with-deps chromium
      - name: Compare native host and Chromium planning
        run: bun run host:parity
      - name: Compare batch planning
        run: bun run host:parity --batch
      - name: Build unsigned desktop package and CLI
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          bun run tauri build --ci --no-sign --bundles "$BUNDLE" -- --locked
          cargo build --locked --release -p strudeland-cli
      - name: Stage package, CLI archive, and provenance
        env:
          BUNDLE: ${{ matrix.bundle }}
          CLI_SUFFIX: ${{ matrix.suffix }}
          PACKAGE: ${{ matrix.package }}
        run: |
          source_sha=$(git rev-parse HEAD)
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          target_dir=$(jq -j '.target_directory' <<< "$metadata")
          temp_dir=$RUNNER_TEMP
          if [[ "$RUNNER_OS" == Windows ]]; then
            target_dir=$(cygpath -u "$target_dir")
            temp_dir=$(cygpath -u "$temp_dir")
          fi
          artifacts="$temp_dir/strudeland-artifacts"
          cli_stage="$temp_dir/strudeland-cli"
          mkdir -p "$artifacts" "$cli_stage"
          if [[ "$BUNDLE" == nsis ]]; then
            cp "$target_dir"/release/bundle/nsis/*-setup.exe "$artifacts/"
            llvm-readobj --coff-imports "$target_dir/release/strudeland-app.exe"
          else
            cp "$target_dir"/release/bundle/deb/*.deb "$artifacts/"
            dpkg-deb --info "$artifacts"/*.deb
            dpkg-deb --contents "$artifacts"/*.deb
            ldd "$target_dir/release/strudeland-app"
          fi
          cli="strudeland$CLI_SUFFIX"
          cp "$target_dir/release/$cli" "$cli_stage/"
          cp -R LICENSE LICENSES THIRD-PARTY-NOTICES.md "$cli_stage/"
          for file in crates/*/LICENSE-* vendor/strudel/LICENSE; do
            mkdir -p "$cli_stage/$(dirname "$file")"
            cp "$file" "$cli_stage/$file"
          done
          version=$(jq -j '.packages[] | select(.name == "strudeland-cli") | .version' <<< "$metadata")
          test "$version" = "$(jq -j '.version' src-tauri/tauri.conf.json)"
          "$cli_stage/$cli" --version
          archive="strudeland-cli-$version-$PACKAGE"
          if [[ "$RUNNER_OS" == Windows ]]; then
            llvm-readobj --coff-imports "$cli_stage/$cli"
            (cd "$cli_stage" && 7z a -tzip "../strudeland-artifacts/$archive.zip" .)
          else
            tar -czf "$artifacts/$archive.tar.gz" -C "$cli_stage" .
          fi
          (
            cd "$artifacts"
            printf 'source=%s\nversion=%s\nsigning=unsigned\nrunner=%s %s (%s %s)\n' \
              "$source_sha" "$version" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" > BUILD.txt
            sha256sum ./* > SHA256SUMS
          )
      - name: Upload packages for review
        if: github.event.repository.private
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: strudeland-${{ matrix.package }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/strudeland-artifacts
          if-no-files-found: error
          compression-level: 0
