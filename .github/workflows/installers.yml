name: Installers

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        description: Verified commit to package
        required: true
        type: string
      bundle:
        description: Tauri bundle format to build
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.94.1

jobs:
  installers:
    name: Installer (${{ matrix.bundle }})
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(inputs.bundle == 'msi' && '["msi"]' || '["dmg","msi","deb"]') }}
    runs-on: ${{ matrix.bundle == 'dmg' && 'macos-15' || matrix.bundle == 'msi' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.source || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake file libasound2-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config
      - name: Install build dependencies
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          bun install --frozen-lockfile
      - name: Build installer
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          if [[ "$BUNDLE" == dmg ]]; then
            bun run tauri build --ci --bundles dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}' -- --locked
            bash scripts/stage-installer.sh dmg adhoc
          else
            bun run tauri build --ci --no-sign --bundles "$BUNDLE" -- --locked
            bash scripts/stage-installer.sh "$BUNDLE" unsigned
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: strudeland-${{ matrix.bundle }}
          path: ${{ runner.temp }}/strudeland-installer
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
