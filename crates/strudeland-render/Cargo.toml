[package]
name = "strudeland-render"
version = "0.1.0"
description = "strudeland render pipeline: plans a song with the headless host, renders it with the engine and joins the chunks"
authors = ["Andrew Rudoi"]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[lib]
name = "strudeland_render"
path = "src/lib.rs"

[[bin]]
name = "strudeland-render"
path = "src/bin/strudeland-render.rs"

[features]
host-jitless = ["strudeland-host/jitless"]

[dependencies]
strudeland-engine = { path = "../strudeland-engine" }
strudeland-host = { path = "../strudeland-host" }
strudeland-project = { path = "../strudeland-project" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
mp3lame-encoder = "=0.3.0"
mp3lame-sys = "=0.2.0"
vorbis_rs = { version = "=0.5.6", default-features = false }
opus = "=0.4.0"
opusic-sys = "=0.7.7"
ogg = "=0.9.2"
rubato = "=5.1.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["mp3", "vorbis", "ogg"] }

[dev-dependencies]
tempfile = "=3.27.0"
