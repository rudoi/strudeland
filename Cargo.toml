[workspace]
resolver = "3"
members = ["src-tauri", "crates/strudeland-project", "crates/strudeland-ctl", "crates/strudeland-cli", "crates/strudeland-engine", "crates/strudeland-host", "crates/strudeland-live", "crates/strudeland-render", "crates/strudeland-record", "crates/strudeland-transcribe"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.strudeland-engine]
opt-level = 3

[profile.dev.package.strudeland-live]
opt-level = 3

[profile.dev.package.strudeland-transcribe]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
