[package]
name = "strudeland-project"
version = "0.1.0"
description = "strudeland project folders: layout, songs, scoped file access, recents"
authors = ["Andrew Rudoi"]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[dependencies]
file-id = "0.2.3"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
