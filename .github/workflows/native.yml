name: Windows and Ubuntu checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Record runner and Bun
        run: |
          printf '%s %s (%s %s)\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          bun --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Test frontend
        run: bun test
      - name: Typecheck frontend
        run: bun run check
      - name: Check formatting
        run: bun run lint

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    env:
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake file libasound2-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config
      - name: Set up the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Record runner and build tools
        run: |
          printf '%s %s (%s %s)\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          rustc -vV
          cmake --version
      - uses: ./.github/actions/cargo-cache
        id: cargo-cache
        with:
          profile: debug
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compile Rust workspace tests
        run: cargo test --locked --workspace --no-run --timings
      - name: Test Rust workspace
        run: cargo test --locked --workspace --no-fail-fast -- --skip dropout_short
      - name: Save Cargo cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.exact-hit != 'true'
        uses: ./.github/actions/cargo-cache
        with:
          profile: debug
          save: 'true'
