[package]
name = "strudeland-app"
version = "0.1.2"
description = "strudeland: a desktop editor for Strudel"
authors = ["Andrew Rudoi"]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[lib]
name = "strudeland_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.4"
strudeland-project = { path = "../crates/strudeland-project" }
strudeland-ctl = { path = "../crates/strudeland-ctl", features = ["server"] }
strudeland-record = { path = "../crates/strudeland-record" }
strudeland-host = { path = "../crates/strudeland-host" }
strudeland-live = { path = "../crates/strudeland-live" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
strudeland-render = { path = "../crates/strudeland-render", features = ["host-jitless"] }
rustix = { version = "1.1.6", features = ["fs"] }
# Features beyond what tauri and wry already enable would pull new crates; keep them explicit.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSData", "NSDictionary", "NSError", "NSString", "objc2-core-services"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }
block2 = "0.6.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

[dev-dependencies]
strudeland-ctl = { path = "../crates/strudeland-ctl", features = ["wire-fixtures"] }
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
strudeland-render = { path = "../crates/strudeland-render" }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
cairo-rs = { version = "=0.18.5", features = ["png"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Devices_Enumeration", "Win32_System_Com_StructuredStorage"] }
