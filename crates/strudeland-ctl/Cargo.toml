[package]
name = "strudeland-ctl"
version = "0.1.0"
description = "strudeland control socket: JSON-RPC protocol types, framing and a blocking client"
authors = ["Andrew Rudoi"]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[features]
# Exposes the golden wire examples (`tests/wire/`) as `wire_fixtures`; only ever turned on by
# other crates' dev-dependencies.
wire-fixtures = []

[dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "rt"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO"] }
