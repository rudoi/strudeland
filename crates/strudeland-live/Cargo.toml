[package]
name = "strudeland-live"
version = "0.1.0"
description = "strudeland live playback: the engine thread, a ring to the audio device, clock anchors and stats"
authors = ["Andrew Rudoi"]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[dependencies]
strudeland-engine = { path = "../strudeland-engine" }
cpal = "=0.18.2"
rtrb = "0.4.1"
rubato = "=5.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
thiserror = "=2.0.21"

[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = "0.6"
